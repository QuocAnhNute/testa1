<script>
/* =========================================================
   DỮ LIỆU 10 CÂU HỎI TRẮC NGHIỆM – SEMAPHORE TRONG FREERTOS
   ========================================================= */
const quizData = [

  /* -------- Câu 1 -------- */
  {
    question: "Trong FreeRTOS, semaphore nhị phân (binary semaphore) có giá trị đếm nằm trong khoảng nào?",
    options: [
      "Chỉ nhận giá trị $0$ hoặc $1$",
      "Nhận mọi giá trị nguyên dương",
      "Nhận giá trị từ $0$ đến $\\text{configMAX\\_SEMAPHORES} - 1$",
      "Nhận giá trị âm hoặc dương tùy ý"
    ],
    correct: 0,
    notes: [
      "Đúng. Binary semaphore chỉ có hai trạng thái: có sẵn (đếm bằng $1$) hoặc không có sẵn (đếm bằng $0$).",
      "Sai. Đó là đặc điểm của counting semaphore, không phải binary semaphore.",
      "Sai. Không có macro cấu hình nào giới hạn giá trị của semaphore như vậy.",
      "Sai. Bộ đếm semaphore không bao giờ nhận giá trị âm trong FreeRTOS."
    ],
    explain: "Semaphore nhị phân được dùng như một cờ báo hiệu: giá trị $0$ nghĩa là không có tín hiệu, giá trị $1$ nghĩa là có tín hiệu. Khi một task gọi hàm \"take\" thành công, bộ đếm chuyển từ $1$ về $0$; khi một task gọi \"give\", bộ đếm chuyển từ $0$ lên $1$. Do đó giá trị luôn thuộc tập $\\{0, 1\\}$."
  },

  /* -------- Câu 2 -------- */
  {
    question: "Điểm khác biệt cốt lõi giữa semaphore nhị phân và mutex trong FreeRTOS là gì?",
    options: [
      "Mutex có cơ chế kế thừa ưu tiên (priority inheritance), còn semaphore nhị phân thì không",
      "Mutex có thể đếm nhiều hơn $1$, còn semaphore nhị phân chỉ có $1$",
      "Semaphore nhị phân chỉ dùng được trong ngắt, còn mutex chỉ dùng trong task",
      "Hai loại hoàn toàn giống nhau về mọi mặt"
    ],
    correct: 0,
    notes: [
      "Đúng. Mutex được thiết kế cho việc bảo vệ tài nguyên dùng chung và có cơ chế kế thừa ưu tiên để tránh đảo ngược ưu tiên.",
      "Sai. Cả hai đều có giá trị tối đa là $1$; đặc điểm \"đếm nhiều\" thuộc về counting semaphore.",
      "Sai. Cả hai đều có thể dùng trong task; trong ngắt chỉ được dùng các hàm có hậu tố <i>FromISR</i>.",
      "Sai. Chúng khác nhau về mục đích sử dụng và cơ chế xử lý ưu tiên."
    ],
    explain: "Về bản chất triển khai, mutex và binary semaphore khá giống nhau, nhưng mutex có thêm cơ chế <b>kế thừa ưu tiên</b> (priority inheritance). Khi một task có ưu tiên thấp đang giữ mutex mà bị task ưu tiên trung bình chen ngang, FreeRTOS sẽ tạm nâng ưu tiên của task đang giữ mutex lên bằng task đang chờ, nhờ đó giảm hiện tượng đảo ngược ưu tiên. Binary semaphore không có cơ chế này."
  },

  /* -------- Câu 3 -------- */
  {
    question: "Counting semaphore trong FreeRTOS thường được dùng cho mục đích nào sau đây?",
    options: [
      "Đếm số sự kiện đã xảy ra hoặc quản lý một lượng tài nguyên có số lượng hữu hạn",
      "Bảo vệ vùng găng (critical section) thay cho mutex",
      "Thay thế hoàn toàn cho ngắt phần cứng",
      "Lưu trữ dữ liệu tạm thời giữa các task"
    ],
    correct: 0,
    notes: [
      "Đúng. Counting semaphore lý tưởng cho việc đếm sự kiện (mỗi lần ngắt give một lần) hoặc quản lý một pool tài nguyên có $N$ phần tử.",
      "Sai. Việc bảo vệ vùng găng nên dùng mutex để tránh đảo ngược ưu tiên.",
      "Sai. Semaphore không thể thay thế ngắt — nó chỉ là cơ chế đồng bộ giữa các task hoặc giữa ngắt và task.",
      "Sai. Để truyền dữ liệu giữa các task, người ta dùng queue hoặc stream buffer, không dùng semaphore."
    ],
    explain: "Counting semaphore có bộ đếm nhận giá trị từ $0$ đến $N$. Mỗi lần \"give\" tăng bộ đếm, mỗi lần \"take\" giảm bộ đếm. Ứng dụng điển hình: đếm số lần một ngắt đã xảy ra (bộ đếm có thể vượt quá $1$ nếu task xử lý chậm hơn tốc độ ngắt), hoặc quản lý một bể gồm $N$ tài nguyên giống nhau (ví dụ $N$ buffer trong pool)."
  },

  /* -------- Câu 4 -------- */
  {
    question: "Khi một task gọi hàm chờ semaphore với thời gian timeout bằng $0$, điều gì sẽ xảy ra nếu semaphore hiện không sẵn sàng?",
    options: [
      "Hàm trả về ngay lập tức với mã lỗi, task không bị chặn",
      "Task bị chặn vô thời hạn cho đến khi có semaphore",
      "Task bị chặn đúng $1$ tick rồi tự động thoát",
      "Hệ thống tự động khởi động lại"
    ],
    correct: 0,
    notes: [
      "Đúng. Timeout bằng $0$ nghĩa là \"kiểm tra rồi trả về ngay\", đây là cách thăm dò không chặn (non-blocking poll).",
      "Sai. Chặn vô thời hạn tương ứng với timeout bằng giá trị đặc biệt (thường là $\\text{portMAX\\_DELAY}$).",
      "Sai. Không có cơ chế tự động chặn $1$ tick khi timeout bằng $0$.",
      "Sai. FreeRTOS không có hành vi tự khởi động lại trong tình huống này."
    ],
    explain: "Tham số timeout trong các hàm chờ semaphore quy định số tick tối đa mà task sẵn sàng bị chặn. Khi timeout bằng $0$, nếu semaphore không sẵn sàng thì hàm trả về ngay với giá trị báo thất bại (thường là $\\text{pdFALSE}$), task tiếp tục thực thi mà không chuyển sang trạng thái Blocked. Điều này rất hữu ích khi cần kiểm tra nhanh trong vòng lặp."
  },

  /* -------- Câu 5 -------- */
  {
    question: "Giả sử $\\text{configTICK\\_RATE\\_HZ} = 100$ và một task gọi hàm chờ semaphore với timeout $= 50$ tick. Thời gian chờ tối đa tính bằng mili-giây là:",
    options: [
      "$500$ ms",
      "$50$ ms",
      "$5$ ms",
      "$5000$ ms"
    ],
    correct: 0,
    notes: [
      "Đúng. Mỗi tick dài $10$ ms, nên $50$ tick tương ứng $50 \\times 10 = 500$ ms.",
      "Sai. Kết quả này ứng với việc nhầm $\\text{configTICK\\_RATE\\_HZ} = 1000$.",
      "Sai. Kết quả này chỉ đúng khi $\\text{configTICK\\_RATE\\_HZ} = 10000$.",
      "Sai. Đây là kết quả khi tính nhầm số tick gấp $10$ lần."
    ],
    explain: "Chu kỳ một tick: $T_{tick} = \\dfrac{1}{\\text{configTICK\\_RATE\\_HZ}} = \\dfrac{1}{100}\\ \\text{s} = 10\\ \\text{ms}$. Vậy thời gian chờ tối đa: $t = 50 \\times 10\\ \\text{ms} = 500\\ \\text{ms} = 0{,}5\\ \\text{s}$."
  },

  /* -------- Câu 6 -------- */
  {
    question: "Khi một ngắt (ISR) muốn \"give\" một semaphore để đánh thức một task, hàm nào phải được sử dụng?",
    options: [
      "Phiên bản hàm có hậu tố <i>FromISR</i>",
      "Phiên bản hàm thông thường dùng trong task",
      "Bất kỳ hàm nào cũng được, không có sự khác biệt",
      "Chỉ có thể dùng mutex trong ngắt"
    ],
    correct: 0,
    notes: [
      "Đúng. Trong ISR bắt buộc dùng các hàm có hậu tố <i>FromISR</i> vì chúng an toàn với ngữ cảnh ngắt và trả về thông tin về việc có cần chuyển ngữ cảnh hay không.",
      "Sai. Hàm thông thường có thể gọi các API không an toàn trong ngắt, gây treo hoặc hỏng hệ thống.",
      "Sai. FreeRTOS phân biệt rõ ràng giữa ngữ cảnh task và ngữ cảnh ngắt.",
      "Sai. Mutex không được phép dùng trong ngắt; chỉ binary semaphore mới phù hợp để báo hiệu từ ngắt."
    ],
    explain: "Các API FreeRTOS có hai phiên bản: một dùng trong task và một dùng trong ISR (có hậu tố <i>FromISR</i>). Trong ngắt phải dùng phiên bản <i>FromISR</i>, và thường phải truyền thêm tham số <i>pxHigherPriorityTaskWoken</i> để báo cho kernel biết có cần chuyển ngữ cảnh ngay khi thoát ngắt hay không. Mutex tuyệt đối không được dùng trong ISR vì cơ chế kế thừa ưu tiên không hoạt động trong ngữ cảnh ngắt."
  },

  /* -------- Câu 7 -------- */
  {
    question: "Hiện tượng \"đảo ngược ưu tiên\" (priority inversion) xảy ra khi nào?",
    options: [
      "Task ưu tiên cao phải chờ một task ưu tiên thấp đang giữ tài nguyên, trong khi task ưu tiên trung bình chen vào chạy",
      "Hai task cùng ưu tiên chạy song song trên hai nhân CPU",
      "Task ưu tiên cao luôn được cấp CPU trước task ưu tiên thấp",
      "Hệ thống tự động tăng ưu tiên cho mọi task"
    ],
    correct: 0,
    notes: [
      "Đúng. Đây là mô tả chính xác của hiện tượng đảo ngược ưu tiên — task ưu tiên cao bị \"chôn\" sau task ưu tiên trung bình vì phải chờ task ưu tiên thấp nhả tài nguyên.",
      "Sai. Đây là hoạt động bình thường trên hệ đa nhân, không phải đảo ngược ưu tiên.",
      "Sai. Đây là hành vi đúng của bộ lập lịch, không phải hiện tượng bất thường.",
      "Sai. FreeRTOS không tự động tăng ưu tiên cho mọi task; chỉ mutex mới kích hoạt kế thừa ưu tiên có chọn lọc."
    ],
    explain: "Đảo ngược ưu tiên xảy ra theo kịch bản: task $H$ (ưu tiên cao) chờ mutex đang bị task $L$ (ưu tiên thấp) giữ; trong lúc đó task $M$ (ưu tiên trung bình) sẵn sàng và chiếm CPU, khiến $L$ không được chạy để nhả mutex, và $H$ bị chặn gián tiếp bởi $M$. Giải pháp là dùng mutex có cơ chế kế thừa ưu tiên để tạm nâng ưu tiên của $L$, giúp $L$ nhanh chóng nhả tài nguyên."
  },

  /* -------- Câu 8 -------- */
  {
    question: "Một counting semaphore được khởi tạo với giá trị ban đầu $N = 3$. Sau khi ba task lần lượt \"take\" thành công, giá trị bộ đếm là bao nhiêu?",
    options: [
      "$0$",
      "$3$",
      "$-3$",
      "$\\dfrac{3}{3} = 1$"
    ],
    correct: 0,
    notes: [
      "Đúng. Mỗi lần \"take\" thành công giảm bộ đếm đi $1$, sau $3$ lần thì $3 - 3 = 0$.",
      "Sai. $3$ là giá trị ban đầu, chưa trừ đi số lần take.",
      "Sai. Bộ đếm semaphore không bao giờ nhận giá trị âm trong FreeRTOS.",
      "Sai. Phép chia không có ý nghĩa trong ngữ cảnh này."
    ],
    explain: "Bộ đếm của counting semaphore được khởi tạo bằng $N$ (số tài nguyên sẵn có). Mỗi lần \"take\" thành công làm giá trị giảm $1$; mỗi lần \"give\" làm giá trị tăng $1$ (tối đa bằng $N$). Sau ba lần take liên tiếp: $3 - 1 - 1 - 1 = 0$. Nếu có task thứ tư gọi \"take\" với timeout khác $0$ thì nó sẽ bị chặn cho đến khi có task nhả tài nguyên."
  },

  /* -------- Câu 9 -------- */
  {

    options: [

  {

    options: [

      "$0$",

/* =========================================================
   HIỂN THỊ ĐỀ THI
   ========================================================= */
const quizEl  = document.getElementById('quiz');
const scoreEl = document.getElementById('score');
const LETTERS = ['A', 'B', 'C', 'D'];

let correctCount = 0;

/* --- Render công thức MathJax (chờ thư viện sẵn sàng) --- */
let mathJaxTries = 0;
function typesetMath(el) {
  if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
    window.MathJax.typesetPromise([el]).catch(err => console.warn('MathJax:', err));
  } else if (mathJaxTries++ < 150) {
    setTimeout(() => typesetMath(el), 100);
  }
}

/* --- Cập nhật điểm --- */
function updateScore() {
  scoreEl.textContent = correctCount + ' / ' + quizData.length;
}

/* --- Xây dựng toàn bộ đề --- */
function buildQuiz() {
  quizEl.innerHTML = '';
  correctCount = 0;
  updateScore();

  quizData.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = '<span class="badge">Câu ' + (qi + 1) + '</span>';

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerHTML = item.question;

    const opts = document.createElement('div');
    opts.className = 'options';

    item.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.innerHTML =
        '<span class="letter">' + LETTERS[oi] + '</span>' +
        '<span class="opt-text">' + opt + '</span>';
      btn.addEventListener('click', () => handleSelect(qi, oi, card, opts));
      opts.appendChild(btn);
    });

    const exp = document.createElement('div');
    exp.className = 'explanation';

    card.appendChild(head);
    card.appendChild(qText);
    card.appendChild(opts);
    card.appendChild(exp);
    quizEl.appendChild(card);
  });

  typesetMath(quizEl);
}

/* =========================================================
   XỬ LÝ KHI CHỌN ĐÁP ÁN
   ========================================================= */
function handleSelect(qi, oi, card, opts) {
  if (card.dataset.done === '1') return;   // đã trả lời -> không cho chọn lại
  card.dataset.done = '1';

  const item    = quizData[qi];
  const isRight = (oi === item.correct);

  // Tô màu các lựa chọn
  const buttons = opts.querySelectorAll('.option');
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === item.correct) btn.classList.add('correct');   // đáp án đúng: XANH
    if (i === oi && !isRight) btn.classList.add('wrong');   // chọn sai: ĐỎ
  });

  if (isRight) correctCount++;
  updateScore();

  // Tạo nội dung lời giải
  const exp = card.querySelector('.explanation');
  let html = '';

  if (isRight) {
    html += '<div class="verdict ok">✅ Chính xác! Đáp án ' + LETTERS[item.correct] + ' là đúng.</div>';
    html += '<p><b>Vì sao đúng:</b> ' + item.notes[oi] + '</p>';
  } else {
    html += '<div class="verdict no">❌ Chưa đúng! Bạn chọn ' + LETTERS[oi] +
            ' — đáp án đúng là <b>' + LETTERS[item.correct] + '</b>.</div>';
    html += '<p><b>Vì sao lựa chọn ' + LETTERS[oi] + ' sai:</b> ' + item.notes[oi] + '</p>';
    html += '<p><b>Vì sao ' + LETTERS[item.correct] + ' đúng:</b> ' + item.notes[item.correct] + '</p>';
  }

  html += '<p><b>📘 Lời giải chi tiết:</b> ' + item.explain + '</p>';

  exp.innerHTML = html;
  exp.classList.add('show', isRight ? 'ok' : 'no');

  typesetMath(exp);
}

/* =========================================================
   KHỞI ĐỘNG
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  buildQuiz();
  document.getElementById('resetBtn').addEventListener('click', () => {
    buildQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
